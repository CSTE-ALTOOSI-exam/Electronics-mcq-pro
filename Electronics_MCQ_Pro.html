<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Electronics MCQ Pro</title><style>
:root{--bg:#fff7ed;--c:rgba(255,255,255,.78);--t:#2a1708;--m:#8a6a52;--b:rgba(20,23,42,.12);--p:#ea580c;--p2:#f59e0b;--ok:#10b981;--okb:rgba(16,185,129,.16);--no:#ef4444;--nob:rgba(239,68,68,.16);--g1:rgba(234,88,12,.28);--g2:rgba(245,158,11,.26);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150d07;--c:rgba(44,28,16,.72);--t:#fff4e8;--m:#d2b79e;--b:rgba(255,255,255,.1);--p:#fb923c;--g1:rgba(234,88,12,.32);--g2:rgba(245,158,11,.18);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150d07;--c:rgba(44,28,16,.72);--t:#fff4e8;--m:#d2b79e;--b:rgba(255,255,255,.1);--p:#fb923c;--g1:rgba(234,88,12,.32);--g2:rgba(245,158,11,.18);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--t);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.6;background:radial-gradient(600px 400px at 85% -5%,var(--g1),transparent),radial-gradient(500px 400px at 5% 30%,var(--g2),transparent),var(--bg);background-attachment:fixed}
.w{max-width:720px;margin:auto;padding:18px 16px 40px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:26px;margin:0;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.chip{font-size:12px;padding:5px 12px;border-radius:99px;background:var(--c);border:1px solid var(--b);color:var(--m);backdrop-filter:blur(10px)}
.sub{color:var(--m);font-size:14px;margin:4px 0 14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:14px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
.tabs button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;transform:translateY(-1px);box-shadow:0 8px 20px -8px var(--p)}
.pr{height:8px;border-radius:9px;background:var(--b);overflow:hidden;margin:6px 0 6px}
.pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .4s}
.st{display:flex;justify-content:space-between;font-size:13px;color:var(--m)}
.card{margin-top:14px;background:var(--c);border:1px solid var(--b);border-radius:22px;padding:20px;backdrop-filter:blur(16px);box-shadow:0 20px 50px -30px #000;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tag{font-size:12px;color:var(--p);font-weight:700;margin-bottom:8px}
.q{direction:ltr;text-align:left;font-size:18px;font-weight:700;margin:0 0 14px;line-height:1.5}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;direction:ltr;text-align:left;background:transparent;color:var(--t);border:1.5px solid var(--b);border-radius:14px;padding:11px 12px;margin:8px 0;font:inherit;font-size:15px;cursor:pointer;transition:.2s}
.o:hover{border-color:var(--p);transform:translateX(3px)}
.o b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--b);display:grid;place-items:center;font-size:12px}
.done .o{pointer-events:none;transform:none}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.ok b{background:var(--ok);color:#fff}
.o.no{background:var(--nob);border-color:var(--no)}.o.no b{background:var(--no);color:#fff}
.tr{display:none;margin-top:14px;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--b);animation:in .35s}
.tr h4{margin:0 0 6px;font-size:13px;color:var(--m)}.tr p{margin:0 0 10px;font-size:15px}
.nx{display:none;margin-top:14px;width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));cursor:pointer}
.done .tr,.done .nx{display:block}
.rs{text-align:center}.rs svg{width:150px;height:150px}
.rs button{margin:6px;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer}
.rs button.m{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0}
footer{text-align:center;color:var(--m);font-size:13px;margin-top:28px}

.o span{flex:1}.tr .ans{font-weight:700;margin-bottom:8px;font-size:15px}.tr .st{margin:6px 0;font-size:14px}.nt{margin-top:8px;font-size:13px;color:var(--m)}
.eq{direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--b);border-radius:6px;padding:0 6px}
.eqblock{direction:ltr;text-align:left;background:var(--b);border-radius:10px;padding:6px 10px;margin:4px 0;overflow-x:auto}

<script>
const Q=[{"t": [1], "q": "Using the approximate silicon-diode model (V_D = 0.7 V), determine the diode current I_D in the series circuit shown.", "a": "باستخدام نموذج دايود السيليكون التقريبي (V_D = 0.7 V)، أوجد تيار الدايود I_D في دائرة التوالي المبينة.", "c": "18.6 mA", "w": ["20.0 mA", "0.7 mA", "9.3 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">18.6 mA<\/span><\/div><div class=\"st\"><b>1. تحديد حالة الدايود:<\/b> القطب الموجب للمصدر متصل بالأنود، فالدايود في انحياز أمامي (ON)، ونستخدم <span class=\"eq\" dir=\"ltr\">V<sub>D<\/sub> = 0.7 V<\/span>.<\/div><div class=\"st\"><b>2. جهد المقاومة:<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>R<\/sub> = E − V<sub>D<\/sub> = 10 − 0.7 = 9.3 V<\/div><\/div><div class=\"st\"><b>3. التيار:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>D<\/sub> = V<sub>R<\/sub> / R = 9.3 V / 0.5 kΩ = 9.3 / 500 Ω<br>I<sub>D<\/sub> = 0.0186 A = 18.6 mA<\/div><\/div><div class=\"nt\">ملاحظة: الخيار A (20 mA) هو E/R بإهمال هبوط الدايود، والخيار D (9.3) هو قيمة V<sub>R<\/sub> بالفولت وليس التيار.<\/div>", "g": "Quiz", "h": 1, "f": "<div class=\"cktwrap\"><svg class=\"ckt\" viewBox=\"0 0 436 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>.cw{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.ct{fill:currentColor;font-family:Cairo,DejaVu Sans,sans-serif}.cp{fill:#e03131;font-weight:bold}.cm{fill:#2f7de1;font-weight:bold}.ca{stroke:#e8590c;stroke-width:2}.cah{fill:#e8590c}.ci{fill:#e8590c;font-weight:bold}<\/style><g transform=\"translate(36,0)\"><polyline class=\"cw\" points=\"60,40 125,40\"/><polyline class=\"cw\" points=\"155,40 310,40 310,75\"/><polyline class=\"cw\" points=\"310,75 310,81 302,85.4 318,94.2 302,103.1 318,111.9 302,120.8 318,129.6 310,134 310,140\"/><polyline class=\"cw\" points=\"310,140 310,175 60,175 60,105\"/><polyline class=\"cw\" points=\"60,95 60,40\"/><polyline class=\"cw\" points=\"46,95 74,95\"/><polyline class=\"cw\" points=\"53,105 67,105\"/><polyline class=\"cw\" points=\"60,175 60,181\"/><polyline class=\"cw\" points=\"48,181 72,181\"/><polyline class=\"cw\" points=\"52,186 68,186\"/><polyline class=\"cw\" points=\"56,191 64,191\"/><polygon points=\"125,29 125,51 155,40\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"155,29 155,51\"/><text x=\"44\" y=\"104\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">E = 10 V<\/text><text x=\"76\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"76\" y=\"120\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><text x=\"140\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">Si<\/text><text x=\"113\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"167\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><text x=\"140\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">V<tspan dy=\"3\" font-size=\"9\">D<\/tspan><\/text><line x1=\"70\" y1=\"26\" x2=\"98.0\" y2=\"26.0\" class=\"ca\"/><polygon points=\"102.0,26.0 94.6,29.1 94.6,22.9\" class=\"cah\"/><text x=\"86\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">D<\/tspan><\/text><text x=\"322\" y=\"110\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">R = 0.5 kΩ<\/text><text x=\"288\" y=\"88\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"288\" y=\"138\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><text x=\"284\" y=\"114\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">V<tspan dy=\"3\" font-size=\"9\">R<\/tspan><\/text><\/g><\/svg><\/div>"}, {"t": [1], "q": "The Si diode has a 0.7 V drop and the red LED has a 1.8 V drop. Find the current I_D in the series circuit.", "a": "دايود Si هبوطه 0.7 V وLED أحمر هبوطه 1.8 V. أوجد التيار I_D في دائرة التوالي.", "c": "13.97 mA", "w": ["17.65 mA", "0 mA", "9.50 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">13.97 mA<\/span><\/div><div class=\"st\"><b>1. حالة الدايودين:<\/b> كلاهما في اتجاه التوصيل الأمامي، فكلاهما ON.<\/div><div class=\"st\"><b>2. جهد الخرج (مجموع الهبوطات يُطرح من المصدر):<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>o<\/sub> = E − V<sub>D1<\/sub> − V<sub>D2<\/sub> = 12 − 0.7 − 1.8 = 9.5 V<\/div><\/div><div class=\"st\"><b>3. التيار:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>D<\/sub> = I<sub>R<\/sub> = V<sub>o<\/sub> / R = 9.5 / 680 = 0.01397 A<br>I<sub>D<\/sub> ≈ 13.97 mA<\/div><\/div><div class=\"nt\">ملاحظة: الخيار D (9.50) هو قيمة الجهد V<sub>o<\/sub> وليس التيار.<\/div>", "g": "Quiz", "h": 1, "f": "<div class=\"cktwrap\"><svg class=\"ckt\" viewBox=\"0 0 436 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>.cw{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.ct{fill:currentColor;font-family:Cairo,DejaVu Sans,sans-serif}.cp{fill:#e03131;font-weight:bold}.cm{fill:#2f7de1;font-weight:bold}.ca{stroke:#e8590c;stroke-width:2}.cah{fill:#e8590c}.ci{fill:#e8590c;font-weight:bold}<\/style><g transform=\"translate(36,0)\"><circle cx=\"40\" cy=\"50\" r=\"4\" class=\"cw\" style=\"fill:none\"/><polyline class=\"cw\" points=\"44,50 90,50\"/><polygon points=\"90,39 90,61 120,50\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"120,39 120,61\"/><polyline class=\"cw\" points=\"120,50 170,50\"/><polygon points=\"170,39 170,61 200,50\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"200,39 200,61\"/><polyline class=\"cw\" points=\"200,50 270,50\"/><circle cx=\"270\" cy=\"50\" r=\"3.2\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"270,50 340,50\"/><circle cx=\"344\" cy=\"50\" r=\"4\" class=\"cw\" style=\"fill:none\"/><line x1=\"182\" y1=\"36\" x2=\"193.2\" y2=\"24.8\" class=\"ca\"/><polygon points=\"196.0,22.0 193.0,29.4 188.6,25.0\" class=\"cah\"/><line x1=\"194\" y1=\"40\" x2=\"205.2\" y2=\"28.8\" class=\"ca\"/><polygon points=\"208.0,26.0 205.0,33.4 200.6,29.0\" class=\"cah\"/><polyline class=\"cw\" points=\"270,50 270,80\"/><polyline class=\"cw\" points=\"270,80 270,86 262,90.0 278,98.0 262,106.0 278,114.0 262,122.0 278,130.0 270,134 270,140\"/><polyline class=\"cw\" points=\"270,140 270,160\"/><polyline class=\"cw\" points=\"270,160 270,166\"/><polyline class=\"cw\" points=\"258,166 282,166\"/><polyline class=\"cw\" points=\"262,171 278,171\"/><polyline class=\"cw\" points=\"266,176 274,176\"/><text x=\"40\" y=\"36\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"40\" y=\"72\" text-anchor=\"middle\" font-size=\"12\" class=\"ct cp\">+12 V<\/text><text x=\"105\" y=\"80\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">Si<\/text><text x=\"185\" y=\"80\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">LED red<\/text><text x=\"286\" y=\"115\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">680 Ω<\/text><line x1=\"55\" y1=\"36\" x2=\"81.0\" y2=\"36.0\" class=\"ca\"/><polygon points=\"85.0,36.0 77.6,39.1 77.6,32.9\" class=\"cah\"/><text x=\"70\" y=\"26\" text-anchor=\"middle\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">D<\/tspan><\/text><line x1=\"250\" y1=\"88\" x2=\"250.0\" y2=\"122.0\" class=\"ca\"/><polygon points=\"250.0,126.0 246.9,118.6 253.1,118.6\" class=\"cah\"/><text x=\"244\" y=\"110\" text-anchor=\"end\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">R<\/tspan><\/text><text x=\"366\" y=\"66\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">V<tspan dy=\"3\" font-size=\"9\">o<\/tspan><\/text><text x=\"366\" y=\"48\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><\/g><\/svg><\/div>"}, {"t": [1], "q": "For two identical conducting Si diodes in parallel, determine the current through each diode (I_D1 = I_D2).", "a": "لدايودين Si متماثلين موصلين على التوازي، أوجد التيار المار في كل دايود (I_D1 = I_D2).", "c": "14.09 mA", "w": ["28.18 mA", "9.30 mA", "0.70 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">14.09 mA<\/span><\/div><div class=\"st\"><b>1. جهد الخرج:<\/b> الدايودان على التوازي وكلاهما ON، فالجهد عليهما <span class=\"eq\" dir=\"ltr\">V<sub>o<\/sub> = 0.7 V<\/span>.<\/div><div class=\"st\"><b>2. التيار الكلي:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>1<\/sub> = (E − V<sub>D<\/sub>) / R = (10 − 0.7) / 0.33 kΩ = 9.3 / 330<br>I<sub>1<\/sub> = 28.18 mA<\/div><\/div><div class=\"st\"><b>3. تيار كل دايود (متماثلان):<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>D1<\/sub> = I<sub>D2<\/sub> = I<sub>1<\/sub> / 2 = 28.18 / 2 = 14.09 mA<\/div><\/div><div class=\"nt\">ملاحظة: الخيار A (28.18) هو التيار الكلي وليس تيار كل دايود.<\/div>", "g": "Quiz", "h": 1, "f": "<div class=\"cktwrap\"><svg class=\"ckt\" viewBox=\"0 0 436 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>.cw{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.ct{fill:currentColor;font-family:Cairo,DejaVu Sans,sans-serif}.cp{fill:#e03131;font-weight:bold}.cm{fill:#2f7de1;font-weight:bold}.ca{stroke:#e8590c;stroke-width:2}.cah{fill:#e8590c}.ci{fill:#e8590c;font-weight:bold}<\/style><g transform=\"translate(36,0)\"><polyline class=\"cw\" points=\"50,40 100,40\"/><polyline class=\"cw\" points=\"100,40 106,40 110.8,32 120.5,48 130.2,32 139.8,48 149.5,32 159.2,48 164,40 170,40\"/><polyline class=\"cw\" points=\"170,40 340,40\"/><polyline class=\"cw\" points=\"50,40 50,85\"/><polyline class=\"cw\" points=\"36,85 64,85\"/><polyline class=\"cw\" points=\"43,95 57,95\"/><polyline class=\"cw\" points=\"50,95 50,165 340,165\"/><polyline class=\"cw\" points=\"50,165 50,171\"/><polyline class=\"cw\" points=\"38,171 62,171\"/><polyline class=\"cw\" points=\"42,176 58,176\"/><polyline class=\"cw\" points=\"46,181 54,181\"/><circle cx=\"210\" cy=\"40\" r=\"3.2\" fill=\"currentColor\"/><circle cx=\"270\" cy=\"40\" r=\"3.2\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"210,40 210,70\"/><polygon points=\"199,70 221,70 210,100\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"199,100 221,100\"/><polyline class=\"cw\" points=\"210,100 210,165\"/><polyline class=\"cw\" points=\"270,40 270,70\"/><polygon points=\"259,70 281,70 270,100\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"259,100 281,100\"/><polyline class=\"cw\" points=\"270,100 270,165\"/><circle cx=\"210\" cy=\"165\" r=\"3.2\" fill=\"currentColor\"/><circle cx=\"270\" cy=\"165\" r=\"3.2\" fill=\"currentColor\"/><circle cx=\"340\" cy=\"40\" r=\"4\" class=\"cw\" style=\"fill:none\"/><circle cx=\"340\" cy=\"165\" r=\"4\" class=\"cw\" style=\"fill:none\"/><text x=\"358\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"358\" y=\"172\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><text x=\"352\" y=\"108\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">V<tspan dy=\"3\" font-size=\"9\">o<\/tspan><\/text><text x=\"135\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">R = 0.33 kΩ<\/text><line x1=\"105\" y1=\"26\" x2=\"141.0\" y2=\"26.0\" class=\"ca\"/><polygon points=\"145.0,26.0 137.6,29.1 137.6,22.9\" class=\"cah\"/><text x=\"125\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">1<\/tspan><\/text><text x=\"34\" y=\"92\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">E = 10 V<\/text><text x=\"66\" y=\"82\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"66\" y=\"108\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><text x=\"194\" y=\"92\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">D<tspan dy=\"3\" font-size=\"9\">1<\/tspan><tspan dy=\"-3\"> Si<\/tspan><\/text><text x=\"286\" y=\"92\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">D<tspan dy=\"3\" font-size=\"9\">2<\/tspan><tspan dy=\"-3\"> Si<\/tspan><\/text><line x1=\"228\" y1=\"110\" x2=\"228.0\" y2=\"136.0\" class=\"ca\"/><polygon points=\"228.0,140.0 224.9,132.6 231.1,132.6\" class=\"cah\"/><text x=\"232\" y=\"128\" text-anchor=\"start\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">D1<\/tspan><\/text><line x1=\"288\" y1=\"110\" x2=\"288.0\" y2=\"136.0\" class=\"ca\"/><polygon points=\"288.0,140.0 284.9,132.6 291.1,132.6\" class=\"cah\"/><text x=\"292\" y=\"128\" text-anchor=\"start\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">D2<\/tspan><\/text><\/g><\/svg><\/div>"}, {"t": [1], "q": "Assuming the Si diode is ON with V_D = 0.7 V, calculate the current I through the series network.", "a": "بافتراض أن دايود Si في حالة ON وV_D = 0.7 V، احسب التيار I في الدائرة التوالي.", "c": "2.07 mA", "w": ["3.32 mA", "0 mA", "1.45 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">2.07 mA<\/span><\/div><div class=\"st\"><b>1. التحقق من الحالة:<\/b> جهد الأنود 10 V وجهد الكاثود −5 V، والفرق <span class=\"eq\" dir=\"ltr\">10 − (−5) = 15 V &gt; 0.7 V<\/span>، إذن الدايود ON.<\/div><div class=\"st\"><b>2. كتابة قانون كيرشوف للجهد (KVL):<\/b> <div class=\"eqblock\" dir=\"ltr\">E<sub>1<\/sub> − I R<sub>1<\/sub> − V<sub>D<\/sub> − I R<sub>2<\/sub> − E<sub>2<\/sub> = 0<br>10 − 0.7 + 5 = I (4.7k + 2.2k)<br>14.3 = 6.9k × I<\/div><\/div><div class=\"st\"><b>3. التيار:<\/b> <div class=\"eqblock\" dir=\"ltr\">I = 14.3 / 6900 = 0.002073 A ≈ 2.07 mA<\/div><\/div><div class=\"st\"><b>4. للتأكد (اختياري):<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>R2<\/sub> = I R<sub>2<\/sub> = 4.56 V ⇒ V<sub>o<\/sub> = −5 + 4.56 = −0.44 V<\/div><\/div>", "g": "Quiz", "h": 1, "f": "<div class=\"cktwrap\"><svg class=\"ckt\" viewBox=\"0 0 456 205\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>.cw{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.ct{fill:currentColor;font-family:Cairo,DejaVu Sans,sans-serif}.cp{fill:#e03131;font-weight:bold}.cm{fill:#2f7de1;font-weight:bold}.ca{stroke:#e8590c;stroke-width:2}.cah{fill:#e8590c}.ci{fill:#e8590c;font-weight:bold}<\/style><g transform=\"translate(36,0)\"><circle cx=\"40\" cy=\"60\" r=\"4\" class=\"cw\" style=\"fill:none\"/><polyline class=\"cw\" points=\"44, kΩ<\/tspan><\/text><text x=\"242\" y=\"100\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"242\" y=\"126\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">V<tspan dy=\"3\" font-size=\"9\">2<\/tspan><\/text><text x=\"242\" y=\"148\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><text x=\"260\" y=\"198\" text-anchor=\"middle\" font-size=\"12\" class=\"ct cm\">E<tspan dy=\"3\" font-size=\"9\">2<\/tspan><tspan dy=\"-3\"> = −5 V<\/tspan><\/text><text x=\"378\" y=\"64\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">V<tspan dy=\"3\" font-size=\"9\">o<\/tspan><\/text><text x=\"374\" y=\"48\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><\/g><\/svg><\/div>"}, {"t": [1], "q": "For the circuit with both Si diodes conducting (0.7 V each), determine the current I_D2 through diode D_2.", "a": "في الدائرة التي يوصل فيها دايودا Si (0.7 V لكل منهما)، أوجد تيار الدايود D₂.", "c": "3.11 mA", "w": ["0.212 mA", "3.32 mA", "0 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">3.11 mA<\/span><\/div><div class=\"st\"><b>1. جهد R₁:<\/b> المقاومة R₁ على التوازي مع D₂ الذي يعمل (ON)، فالجهد عليها <span class=\"eq\" dir=\"ltr\">0.7 V<\/span>.<\/div><div class=\"st\"><b>2. التيار I₁:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>1<\/sub> = 0.7 / 3.3k = 0.212 mA<\/div><\/div><div class=\"st\"><b>3. التيار I₂ من KVL (المسار الخارجي):<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>2<\/sub> = (E − V<sub>D1<\/sub> − V<sub>D2<\/sub>) / R<sub>2<\/sub> = (20 − 0.7 − 0.7) / 5.6k<br>I<sub>2<\/sub> = 18.6 / 5.6k = 3.32 mA<\/div><\/div><div class=\"st\"><b>4. قانون كيرشوف للتيار (KCL) عند العقدة:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>2<\/sub> = I<sub>1<\/sub> + I<sub>D2<\/sub><br>I<sub>D2<\/sub> = 3.32 − 0.212 = 3.11 mA<\/div><\/div><div class=\"nt\">ملاحظة: الخيار A هو I₁ والخيار B هو I₂، أما المطلوب فهو تيار D₂ فقط.<\/div>", "g": "Quiz", "h": 1, "f": "<div class=\"cktwrap\"><svg class=\"ckt\" viewBox=\ kΩ<\/tspan><\/text><line x1=\"268\" y1=\"26\" x2=\"318.0\" y2=\"26.0\" class=\"ca\"/><polygon points=\"322.0,26.0 314.6,29.1 314.6,22.9\" class=\"cah\"/><text x=\"295\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">1<\/tspan><\/text><text x=\"140\" y=\"170\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">R<tspan dy=\"3\" font-size=\"9\">2<\/tspan><tspan dy=\"-3\"> = 5.6 kΩ<\/tspan><\/text><line x1=\"172\" y1=\"122\" x2=\"132.0\" y2=\"122.0\" class=\"ca\"/><polygon points=\"128.0,122.0 135.4,118.9 135.4,125.1\" class=\"cah\"/><text x=\"150\" y=\"114\" text-anchor=\"middle\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">2<\/tspan><\/text><text x=\"214\" y=\"92\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">D<tspan dy=\"3\" font-size=\"9\">2<\/tspan><tspan dy=\"-3\"> Si<\/tspan><\/text><line x1=\"252\" y1=\"76\" x2=\"252.0\" y2=\"100.0\" class=\"ca\"/><polygon points=\"252.0,104.0 248.9,96.6 255.1,96.6\" class=\"cah\"/><text x=\"256\" y=\"94\" text-anchor=\"start\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">D2<\/tspan><\/text><text x=\"36\" y=\"78\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">E = 20 V<\/text><text x=\"66\" y=\"66\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"66\" y=\"94\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><\/g><\/svg><\/div>"}, {"t": [1], "q": "For the first circuit shown below (V_i = 5 V, V_1 = 1.5 V, V_2 = 3.5 V, and R_1 = R_2 = R_3 = 1 kΩ), using V_D = 0.7 V for each ON silicon diode, find the total input current I.", "a": "للدائرة الأولى (V_i = 5 V، V₁ = 1.5 V، V₂ = 3.5 V، R₁ = R₂ = R₃ = 1 kΩ) وبهبوط 0.7 V لكل دايود موصل، أوجد تيار الدخل الكلي I.", "c": "5.0 mA", "w": ["3.4 mA", "2.2 mA", "0.6 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">5.0 mA<\/span><\/div><div class=\"st\"><b>1. الفرع الأول (D₁):<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>1<\/sub> = (V<sub>i<\/sub> − V<sub>D1<\/sub> − V<sub>1<\/sub>) / R<sub>1<\/sub> = (5 − 0.7 − 1.5) / 1k = 2.8 mA<\/div><\/div><div class=\"st\"><b>2. جهد R₃ (عبر D₂ والبطارية V₂):<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>R3<\/sub> = V<sub>2<\/sub> − V<sub>D2<\/sub> = 3.5 − 0.7 = 2.8 V<br>I<sub>3<\/sub> = 2.8 / 1k = 2.8 mA<\/div><\/div><div class=\"st\"><b>3. التيار في R₂:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>2<\/sub> = (V<sub>i<\/sub> − V<sub>R3<\/sub>) / R<sub>2<\/sub> = (5 − 2.8) / 1k = 2.2 mA<\/div><\/div><div class=\"st\"><b>4. التيار الكلي:<\/b> <div class=\"eqblock\" dir=\"ltr\">I = I<sub>1<\/sub> + I<sub>2<\/sub> = 2.8 + 2.2 = 5.0 mA<\/div>تحقق: <span class=\"eq\" dir=\"ltr\">I<sub>D2<\/sub> = I<sub>3<\/sub> − I<sub>2<\/sub> = 0.6 mA &gt; 0<\/span> فالدايود D₂ فعلاً ON.<\/div><div class=\"nt\">ملاحظة: الخيار C (2.2) هو I₂ فقط، والخيار D (0.6) هو تيار D₂.<\/div>", "g": "Quiz", "h": 1, "f": "<div class=\"cktwrap\"><svg class=\"ckt\" viewBox=\"0 0 496 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>.cw{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.ct{fill:currentColor;font-family:Cairo,DejaVu Sans,sans-serif}.cp{fill:#e03131;font-weight:bold}.cm{fill:#2f7de1;font-weight:bold}.ca{stroke:#e8590c;stroke-width:2}.cah{fill:#e8590c}.ci{fill:#e8590c;font-weight:bold}<\/style><g transform=\"translate(36,0)\"><polyline class=\"cw\" points=\"50,40 130,40\"/><circle cx=\"130\" cy=\"40\" r=\"3.2\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"50,40 50,100\"/><polyline class=\"cw\" points=\"36,100 64,100\"/><polyline class=\"cw\" points=\"43,110 57,110\"/><polyline class=\"cw\" points=\"50,110 50,210 370,210\"/><polyline class=\"cw\" points=\"50,210 50,216\"/><polyline class=\"cw\" points=\"38,216 62,216\"/><polyline class=\"cw\" points=\"42,221 58,221\"/><polyline class=\"cw\" points=\"46,226 54,226\"/><polyline class=\"cw\" points=\"130,40 130,60\"/><polygon points=\"119,60 141,60 130,90\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"119,90 141,90\"/><polyline class=\"cw\" points=\"130,90 130,105\"/><polyline class=\"cw\" points=\"130,105 130,111 122,113.8 138,119.2 122,124.8 138,130.2 122,135.8 138,141.2 130,144 130,150\"/><polyline class=\"cw\" points=\"130,150 130,165\"/><polyline class=\"cw\" points=\"116,165 144,165\"/><polyline class=\"cw\" points=\"123,175 137,175\"/><polyline class=\"cw\" points=\"130,175 130,210\"/><circle cx=\"130\" cy=\"210\" r=\"3.2\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"130,40 160,40\"/><polyline class=\"cw\" points=\"160,40 166,40 171.7,32 183.0,48 194.3,32 205.7,48 217.0,32 228.3,48 234,40 240,40\"/><polyline class=\"cw\" points=\"240,40 290,40\"/><circle cx=\"290\" cy=\"40\" r=\"3.2\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"290,40 290,60\"/><polygon points=\"279,90 301,90 290,60\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"279,60 301,60\"/><polyline class=\"cw\" points=\"290,90 290,165\"/><polyline class=\"cw\" points=\"276,165 304,165\"/><polyline class=\"cw\" points=\"283,175 297,175\"/><polyline class=\"cw\" points=\"290,175 290,210\"/><circle cx=\"290\" cy=\"210\" r=\"3.2\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"290,40 370,40 370,80\"/><polyline class=\"cw\" points=\"370,80 370,86 362,90.0 378,98.0 362,106.0 378,114.0 362,122.0 378,130.0 370,134 370,140\"/><polyline class=\"cw\" points=\"370,140 370,210\"/><text x=\"36\" y=\"108\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">V<tspan dy=\"3\" font-size=\"9\">i<\/tspan><tspan dy=\"-3\"> = 5 V<\/tspan><\/text><text x=\"66\" y=\"96\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"66\" y=\"122\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><text x=\"146\" y=\"82\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">D<tspan dy=\"3\" font-size=\"9\">1<\/tspan><\/text><text x=\"144\" y=\"132\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">R<tspan dy=\"3\" font-size=\"9\">1<\/tspan><tspan dy=\"-3\"> = 1 kΩ<\/tspan><\/text><text x=\"116\" y=\"178\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">V<tspan dy=\"3\" font-size=\"9\">1<\/tspan><tspan dy=\"-3\"> = 1.5 V<\/tspan><\/text><text x=\"146\" y=\"164\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"146\" y=\"190\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><text x=\"200\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">R<tspan dy=\"3\" font-size=\"9\">2<\/tspan><tspan dy=\"-3\"> = 1 kΩ<\/tspan><\/text><text x=\"308\" y=\"82\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">D<tspan dy=\"3\" font-size=\"9\">2<\/tspan><\/text><text x=\"276\" y=\"178\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">V<tspan dy=\"3\" font-size=\"9\">2<\/tspan><tspan dy=\"-3\"> = 3.5 V<\/tspan><\/text><text x=\"306\" y=\"164\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cp\">+<\/text><text x=\"306\" y=\"190\" text-anchor=\"middle\" font-size=\"16\" class=\"ct cm\">−<\/text><text x=\"384\" y=\"114\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">R<tspan dy=\"3\" font-size=\"9\">3<\/tspan><tspan dy=\"-3\"> = 1 kΩ<\/tspan><\/text><line x1=\"58\" y1=\"28\" x2=\"96.0\" y2=\"28.0\" class=\"ca\"/><polygon points=\"100.0,28.0 92.6,31.1 92.6,24.9\" class=\"cah\"/><text x=\"79\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" class=\"ct ci\">I<\/text><line x1=\"112\" y1=\"62\" x2=\"112.0\" y2=\"86.0\" class=\"ca\"/><polygon points=\"112.0,90.0 108.9,82.6 115.1,82.6\" class=\"cah\"/><text x=\"108\" y=\"80\" text-anchor=\"end\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">1<\/tspan><\/text><line x1=\"172\" y1=\"26\" x2=\"222.0\" y2=\"26.0\" class=\"ca\"/><polygon points=\"226.0,26.0 218.6,29.1 218.6,22.9\" class=\"cah\"/><text x=\"199\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">2<\/tspan><\/text><line x1=\"352\" y1=\"90\" x2=\"352.0\" y2=\"122.0\" class=\"ca\"/><polygon points=\"352.0,126.0 348.9,118.6 355.1,118.6\" class=\"cah\"/><text x=\"348\" y=\"112\" text-anchor=\"end\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">3<\/tspan><\/text><\/g><\/svg><\/div>"}, {"t": [1], "q": "For the second circuit shown below (R_1 = R_2 = R_3 = 10 kΩ), use the constant-voltage-drop model V_D = 0.7 V. Which set of diode states is consistent with the circuit?", "a": "للدائرة الثانية (R₁ = R₂ = R₃ = 10 kΩ) وبنموذج هبوط الجهد الثابت 0.7 V، أي مجموعة حالات دايودات تتسق مع الدائرة؟", "c": "D1 ON, D2 OFF, D3 ON", "w": ["D1 OFF, D2 ON, D3 OFF", "All diodes ON", "All diodes OFF"], "e": "<div class=\"ans\">الجواب: D1 ON ، D2 OFF ، D3 ON<\/div><div class=\"st\"><b>1. نفترض الحالة: D₁ ON، D₂ OFF، D₃ ON:<\/b> ثم نتحقق من التوافق.<\/div><div class=\"st\"><b>2. D₃ ON: جهد النقطة C:<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>C<\/sub> = 0 − 0.7 = −0.7 V<br>I<sub>3<\/sub> = (−0.7 + 10)/10k = 0.93 mA (يمر عبر D₃ من الأرض)<\/div><\/div><div class=\"st\"><b>3. D₁ ON و D₂ OFF يعني I₁ = I₂:<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>A<\/sub> = V<sub>B<\/sub> − 0.7<br>(10 − V<sub>B<\/sub>)/10k = (V<sub>B<\/sub> − 0.7 + 20)/10k<br>10 − V<sub>B<\/sub> = V<sub>B<\/sub> + 19.3 ⇒ V<sub>B<\/sub> = −4.65 V<br>I<sub>1<\/sub> = I<sub>2<\/sub> = 14.65/10k = 1.465 mA &gt; 0 ✓<\/div><\/div><div class=\"st\"><b>4. التحقق من D₂:<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>B<\/sub> − V<sub>C<\/sub> = −4.65 − (−0.7) = −3.95 V &lt; 0.7 V<\/div>فالدايود D₂ في انحياز عكسي (OFF) ✓. الافتراض متسق.<\/div>", "g": "Quiz", "h": 1, "f": "<div class=\"cktwrap\"><svg class=\"ckt\" viewBox=\"0 0 476 252\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>.cw{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.ct{fill:currentColor;font-family:Cairo,DejaVu Sans,sans-serif}.cp{fill:#e03131;font-weight:bold}.cm{fill:#2f7de1;font-weight:bold}.ca{stroke:#e8590c;stroke-width:2}.cah{fill:#e8590c}.ci{fill:#e8590c;font-weight:bold}<\/style><g transform=\"translate(36,0)\"><circle cx=\"180\" cy=\"18\" r=\"4\" class=\"cw\" style=\"fill:none\"/><polyline class=\"cw\" points=\"180,22 180,50\"/><polyline class=\"cw\" points=\"180,50 180,56 172,59.2 188,65.5 172,71.8 188,78.2 172,84.5 188,90.8 180,94 180,100\"/><polyline class=\"cw\" points=\"180,100 180,125\"/><circle cx=\"180\" cy=\"125\" r=\"3.2\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"180,125 155,125\"/><polygon points=\"155,114 155,136 125,125\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"125,114 125,136\"/><polyline class=\"cw\" points=\"125,125 100,125\"/><circle cx=\"100\" cy=\"125\" r=\"3.2\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"100,125 100,150\"/><polyline class=\"cw\" points=\"100,150 100,156 92,159.2 108,165.5 92,171.8 108,178.2 92,184.5 108,190.8 100,194 100,200\"/><polyline class=\"cw\" points=\"100,200 100,218\"/><circle cx=\"100\" cy=\"222\" r=\"4\" class=\"cw\" style=\"fill:none\"/><polyline class=\"cw\" points=\"180,125 205,125\"/><polygon points=\"205,114 205,136 235,125\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"235,114 235,136\"/><polyline class=\"cw\" points=\"235,125 310,125\"/><circle cx=\"280\" cy=\"125\" r=\"3.2\" fill=\"currentColor\"/><polygon points=\"340,114 340,136 310,125\" fill=\"currentColor\"/><polyline class=\"cw\" points=\"310,114 310,136\"/><polyline class=\"cw\" points=\"340,125 375,125\"/><polyline class=\"cw\" points=\"375,125 375,131\"/><polyline class=\"cw\" points=\"363,131 387,131\"/><polyline class=\"cw\" points=\"367,136 383,136\"/><polyline class=\"cw\" points=\"371,141 379,141\"/><polyline class=\"cw\" points=\"280,125 280,150\"/><polyline class=\"cw\" points=\"280,150 280,156 272,159.2 288,165.5 272,171.8 288,178.2 272,184.5 288,190.8 280,194 280,200\"/><polyline class=\"cw\" points=\"280,200 280,218\"/><circle cx=\"280\" cy=\"222\" r=\"4\" class=\"cw\" style=\"fill:none\"/><text x=\"205\" y=\"24\" text-anchor=\"start\" font-size=\"12\" class=\"ct cp\">+10 V<\/text><text x=\"196\" y=\"80\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">R<tspan dy=\"3\" font-size=\"9\">1<\/tspan><tspan dy=\"-3\"> = 10 kΩ<\/tspan><\/text><line x1=\"162\" y1=\"56\" x2=\"162.0\" y2=\"90.0\" class=\"ca\"/><polygon points=\"162.0,94.0 158.9,86.6 165.1,86.6\" class=\"cah\"/><text x=\"158\" y=\"78\" text-anchor=\"end\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">1<\/tspan><\/text><text x=\"140\" y=\"106\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">D<tspan dy=\"3\" font-size=\"9\">1<\/tspan><\/text><text x=\"220\" y=\"106\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">D<tspan dy=\"3\" font-size=\"9\">2<\/tspan><\/text><text x=\"325\" y=\"106\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">D<tspan dy=\"3\" font-size=\"9\">3<\/tspan><\/text><text x=\"92\" y=\"116\" text-anchor=\"end\" font-size=\"14\" class=\"ct \">A<\/text><text x=\"192\" y=\"142\" text-anchor=\"start\" font-size=\"14\" class=\"ct \">B<\/text><text x=\"286\" y=\"116\" text-anchor=\"start\" font-size=\"14\" class=\"ct \">C<\/text><text x=\"86\" y=\"180\" text-anchor=\"end\" font-size=\"12\" class=\"ct \">R<tspan dy=\"3\" font-size=\"9\">2<\/tspan><tspan dy=\"-3\"> = 10 kΩ<\/tspan><\/text><line x1=\"116\" y1=\"156\" x2=\"116.0\" y2=\"190.0\" class=\"ca\"/><polygon points=\"116.0,194.0 112.9,186.6 119.1,186.6\" class=\"cah\"/><text x=\"120\" y=\"178\" text-anchor=\"start\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">2<\/tspan><\/text><text x=\"100\" y=\"244\" text-anchor=\"middle\" font-size=\"12\" class=\"ct cm\">−20 V<\/text><text x=\"296\" y=\"180\" text-anchor=\"start\" font-size=\"12\" class=\"ct \">R<tspan dy=\"3\" font-size=\"9\">3<\/tspan><tspan dy=\"-3\"> = 10 kΩ<\/tspan><\/text><line x1=\"262\" y1=\"156\" x2=\"262.0\" y2=\"190.0\" class=\"ca\"/><polygon points=\"262.0,194.0 258.9,186.6 265.1,186.6\" class=\"cah\"/><text x=\"258\" y=\"178\" text-anchor=\"end\" font-size=\"12\" class=\"ct ci\">I<tspan dy=\"3\" font-size=\"9\">3<\/tspan><\/text><text x=\"280\" y=\"244\" text-anchor=\"middle\" font-size=\"12\" class=\"ct cm\">−10 V<\/text><text x=\"375\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" class=\"ct \">0 V<\/text><\/g><\/svg><\/div>"}, {"t": [1], "q": "In a pure (intrinsic) silicon semiconductor, which statement is correct?", "a": "في السيليكون النقي (الذاتي)، أي عبارة صحيحة؟", "c": "Electrons and holes are generated in equal numbers", "w": ["Holes are absent", "Only electrons carry current", "The material is a perfect conductor"], "e": "<div class=\"ans\">الجواب: تتولد الإلكترونات والفجوات بأعداد متساوية<\/div><div class=\"st\"><b>1. الفكرة:<\/b> السيليكون النقي لا يحتوي شوائب، وفي الظروف العادية يعمل كعازل تقريباً (كل ذرة ترتبط بأربع ذرات مجاورة بروابط تساهمية).<\/div><div class=\"st\"><b>2. توليد الحاملات:<\/b> عند اكتساب طاقة حرارية ينفلت إلكترون من الرابطة التساهمية فيتكون إلكترون حر وتترك مكانه فجوة. كل إلكترون حر يقابله فجوة واحدة.<\/div><div class=\"st\"><b>3. النتيجة:<\/b> عدد الإلكترونات = عدد الفجوات في السيليكون النقي، وكلاهما يشارك في التوصيل.<\/div><div class=\"nt\">ملاحظة: A و C خطأ لأن الفجوات موجودة وتشارك في التوصيل، وD خطأ لأنه ليس موصلاً مثالياً.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "Adding a pentavalent donor impurity to silicon forms which semiconductor?", "a": "إضافة شائبة خماسية مانحة إلى السيليكون تكوّن أي شبه موصل؟", "c": "N-type with electrons as majority carriers", "w": ["P-type with holes as majority carriers", "Intrinsic semiconductor", "An insulator"], "e": "<div class=\"ans\">الجواب: النوع N (الإلكترونات حاملات أغلبية)<\/div><div class=\"st\"><b>1. الشائبة الخماسية:<\/b> مثل الفوسفور (P) فيها 5 إلكترونات تكافؤ.<\/div><div class=\"st\"><b>2. ما يحدث:<\/b> أربعة منها ترتبط بأربع ذرات سيليكون، ويبقى إلكترون خامس حر. تسمى الذرة مانحة (Donor).<\/div><div class=\"st\"><b>3. النتيجة:<\/b> يتكون شبه موصل من النوع N (السالب): الحاملات الأغلبية إلكترونات، والأقلية فجوات.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "Adding a trivalent acceptor impurity to silicon produces which majority carriers?", "a": "إضافة شائبة ثلاثية مستقبلة إلى السيليكون تنتج أي حاملات أغلبية؟", "c": "Holes", "w": ["Neutrons", "Photons", "Electrons"], "e": "<div class=\"ans\">الجواب: الفجوات<\/div><div class=\"st\"><b>1. الشائبة الثلاثية:<\/b> مثل البورون (B) فيها 3 إلكترونات تكافؤ.<\/div><div class=\"st\"><b>2. ما يحدث:<\/b> تشكل ثلاث روابط فقط مع السيليكون، فتبقى رابطة ناقصة وهي فجوة. تسمى الذرة مستقبلة (Acceptor).<\/div><div class=\"st\"><b>3. النتيجة:<\/b> يتكون شبه موصل من النوع P (الموجب): الحاملات الأغلبية فجوات، والأقلية إلكترونات.<\/div><div class=\"nt\">ملاحظة: النيوترونات والفوتونات ليست حاملات شحنة في أشباه الموصلات.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "When a PN junction is forward biased, what happens to the depletion region width?", "a": "عند انحياز وصلة PN أمامياً، ماذا يحدث لعرض منطقة الاستنزاف؟", "c": "It decreases", "w": ["It becomes infinitely wide", "It remains unchanged", "It disappears under all voltages"], "e": "<div class=\"ans\">الجواب: يقل عرضها (تضيق)<\/div><div class=\"st\"><b>1. الانحياز الأمامي:<\/b> الطرف الموجب للمصدر على المنطقة P والسالب على المنطقة N.<\/div><div class=\"st\"><b>2. التأثير:<\/b> المجال الخارجي يعاكس المجال الداخلي (جهد الحاجز) فيضعفه، وتُدفع الحاملات نحو الوصلة.<\/div><div class=\"st\"><b>3. النتيجة:<\/b> تضيق منطقة الاستنزاف ويسمح الدايود بمرور تيار كبير بعد تجاوز جهد العتبة (≈ 0.7 V للسيليكون).<\/div><div class=\"nt\">ملاحظة: في الانحياز العكسي يحدث العكس: تتسع منطقة الاستنزاف.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "A silicon diode is forward biased and conducting. In the practical constant-voltage-drop model, V_D is approximately:", "a": "دايود سيليكون منحاز أمامياً وموصل. في النموذج العملي (هبوط جهد ثابت) تكون V_D تقريباً:", "c": "0.7 V", "w": ["0 V", "0.3 V", "5 V"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">0.7 V<\/span><\/div><div class=\"st\"><b>1. القاعدة:<\/b> في النموذج العملي يُمثَّل الدايود الموصل ببطارية تساوي جهد الركبة V<sub>γ<\/sub>.<\/div><div class=\"st\"><b>2. القيمة:<\/b> للسيليكون <span class=\"eq\" dir=\"ltr\">V<sub>γ<\/sub> ≈ 0.7 V<\/span>، وللجرمانيوم <span class=\"eq\" dir=\"ltr\">≈ 0.3 V<\/span>.<\/div><div class=\"nt\">ملاحظة: 0 V هي قيمة الدايود المثالي.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "For a germanium diode operating in forward conduction, the commonly assumed practical voltage drop is approximately:", "a": "لدايود جرمانيوم في التوصيل الأمامي، هبوط الجهد العملي المفترض عادةً هو تقريباً:", "c": "0.3 V", "w": ["0.7 V", "1.8 V", "10 V"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">0.3 V<\/span><\/div><div class=\"st\"><b>1. القاعدة:<\/b> جهد الركبة للجرمانيوم <span class=\"eq\" dir=\"ltr\">V<sub>γ<\/sub> ≈ 0.3 V<\/span>.<\/div><div class=\"st\"><b>2. مقارنة:<\/b> السيليكون 0.7 V، والـ LED الأحمر نحو 1.8 V.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "A silicon diode is reverse biased, below breakdown, in the approximate model. Its current is:", "a": "دايود سيليكون منحاز عكسياً وأقل من جهد الانهيار في النموذج التقريبي. تياره:", "c": "Nearly zero", "w": ["E/R", "Very large", "0.7 A"], "e": "<div class=\"ans\">الجواب: قريب من الصفر<\/div><div class=\"st\"><b>1. الانحياز العكسي:<\/b> الدايود يعمل كمفتاح مفتوح (OFF).<\/div><div class=\"st\"><b>2. التيار:<\/b> يمر تيار تسرب صغير جداً (تيار التشبع العكسي I<sub>s<\/sub> بحدود nA إلى µA)، ويُعتبر في النموذج التقريبي <span class=\"eq\" dir=\"ltr\">I<sub>D<\/sub> ≈ 0<\/span> ما لم يُصل إلى جهد الانهيار.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "For a series silicon diode with E = 8 V, R = 2.2 kΩ, and V_D = 0.7 V, find I_D.", "a": "دايود سيليكون على التوالي مع E = 8 V وR = 2.2 kΩ وV_D = 0.7 V. أوجد I_D.", "c": "3.32 mA", "w": ["0.70 mA", "3.64 mA", "0 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">3.32 mA<\/span><\/div><div class=\"st\"><b>1. الحالة:<\/b> الانحياز أمامي، الدايود ON.<\/div><div class=\"st\"><b>2. جهد المقاومة:<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>R<\/sub> = E − V<sub>D<\/sub> = 8 − 0.7 = 7.3 V<\/div><\/div><div class=\"st\"><b>3. التيار:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>D<\/sub> = V<sub>R<\/sub>/R = 7.3 / 2.2k = 0.003318 A ≈ 3.32 mA<\/div><\/div><div class=\"nt\">ملاحظة: الخيار B (3.64) هو E/R = 8/2.2k أي بإهمال هبوط الدايود.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "A 12 V source drives a forward-biased Si diode and R = 5.6 kΩ in series. With V_D = 0.7 V, determine I_D.", "a": "مصدر 12 V يغذي دايود Si منحازاً أمامياً ومقاومة R = 5.6 kΩ على التوالي. بـ V_D = 0.7 V أوجد I_D.", "c": "2.02 mA", "w": ["1.25 mA", "0.70 mA", "12.0 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">2.02 mA<\/span><\/div><div class=\"st\"><b>1. جهد المقاومة:<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>R<\/sub> = 12 − 0.7 = 11.3 V<\/div><\/div><div class=\"st\"><b>2. التيار:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>D<\/sub> = 11.3 / 5.6k = 0.002018 A ≈ 2.02 mA<\/div><\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "A 12 V source drives one Si diode (0.7 V), one Ge diode (0.3 V), and a 5.6 kΩ resistor in series. Determine the current.", "a": "مصدر 12 V مع دايود Si (0.7 V) ودايود Ge (0.3 V) ومقاومة 5.6 kΩ على التوالي. أوجد التيار.", "c": "1.96 mA", "w": ["2.14 mA", "0.18 mA", "0 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">1.96 mA<\/span><\/div><div class=\"st\"><b>1. القاعدة:<\/b> عند توالي الدايودات نجمع هبوطات الجهد ثم نطرحها من جهد المصدر.<\/div><div class=\"st\"><b>2. جهد الخرج:<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>o<\/sub> = E − V<sub>T1<\/sub> − V<sub>T2<\/sub> = 12 − 0.7 − 0.3 = 11 V<\/div><\/div><div class=\"st\"><b>3. التيار:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>D<\/sub> = V<sub>o<\/sub>/R = 11 / 5.6k = 0.00196 A = 1.96 mA<\/div><\/div><div class=\"nt\">ملاحظة: الخيار A (2.14) هو 12/5.6k بإهمال الدايودين.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "For the diode-resistor series circuit, E = 10 V and R = 0.5 kΩ. The DC load-line equation is:", "a": "في دائرة دايود ومقاومة على التوالي، E = 10 V وR = 0.5 kΩ. معادلة خط الحمل DC هي:", "c": "I<sub>D<\/sub> = (10 − V<sub>D<\/sub>)/0.5 kΩ", "w": ["I<sub>D<\/sub> = (V<sub>D<\/sub> − 10)/0.5 kΩ", "V<sub>D<\/sub> = 10 + I<sub>D<\/sub>(0.5 kΩ)", "I<sub>D<\/sub> = 10 × V<sub>D<\/sub>"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">I_D = (10 − V_D) / 0.5 kΩ<\/span><\/div><div class=\"st\"><b>1. قانون كيرشوف للجهد:<\/b> <div class=\"eqblock\" dir=\"ltr\">E = V<sub>D<\/sub> + I<sub>D<\/sub> R<\/div><\/div><div class=\"st\"><b>2. نعزل التيار:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>D<\/sub> = (E − V<sub>D<\/sub>) / R = (10 − V<sub>D<\/sub>) / 0.5 kΩ<\/div><\/div><div class=\"st\"><b>3. المعنى:<\/b> هذه معادلة خط مستقيم على مستوى I<sub>D<\/sub> – V<sub>D<\/sub> يسمى خط الحمل.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "For E = 10 V and R = 0.5 kΩ, what is the load-line intersection with the I_D axis (V_D = 0)?", "a": "عند E = 10 V وR = 0.5 kΩ، ما نقطة تقاطع خط الحمل مع محور I_D (V_D = 0)؟", "c": "20 mA", "w": ["0.5 mA", "10 mA", "5 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">20 mA<\/span><\/div><div class=\"st\"><b>1. الشرط:<\/b> نقطة التقاطع مع محور التيار عند <span class=\"eq\" dir=\"ltr\">V<sub>D<\/sub> = 0<\/span>.<\/div><div class=\"st\"><b>2. الحساب:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>D<\/sub> = E/R = 10 / 0.5 kΩ = 20 mA<\/div>النقطة: <span class=\"eq\" dir=\"ltr\">(0 , 20 mA)<\/span><\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "For E = 10 V and R = 0.5 kΩ, what is the load-line intersection with the V_D axis (I_D = 0)?", "a": "عند E = 10 V وR = 0.5 kΩ، ما نقطة تقاطع خط الحمل مع محور V_D (I_D = 0)؟", "c": "10 V", "w": ["0 V", "0.5 V", "20 V"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">10 V<\/span><\/div><div class=\"st\"><b>1. الشرط:<\/b> نقطة التقاطع مع محور الجهد عند <span class=\"eq\" dir=\"ltr\">I<sub>D<\/sub> = 0<\/span>.<\/div><div class=\"st\"><b>2. الحساب:<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>D<\/sub> = E − I<sub>D<\/sub>R = 10 − 0 = 10 V<\/div>النقطة: <span class=\"eq\" dir=\"ltr\">(10 V , 0)<\/span><\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "Using the practical Si model (V_D = 0.7 V), what is the Q-point current for E = 10 V and R = 0.5 kΩ?", "a": "بنموذج Si العملي (V_D = 0.7 V)، ما تيار نقطة التشغيل Q عند E = 10 V وR = 0.5 kΩ؟", "c": "18.6 mA", "w": ["20.0 mA", "0.7 mA", "1.86 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">18.6 mA<\/span><\/div><div class=\"st\"><b>1. جهد المقاومة:<\/b> <div class=\"eqblock\" dir=\"ltr\">V<sub>R<\/sub> = 10 − 0.7 = 9.3 V<\/div><\/div><div class=\"st\"><b>2. تيار نقطة التشغيل:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>DQ<\/sub> = 9.3 / 0.5k = 18.6 mA<\/div><\/div><div class=\"nt\">ملاحظة: في الملزمة قُرئت القيمة 18.5 mA من المنحنى الحقيقي (V<sub>DQ<\/sub> = 0.78 V)، أما النموذج العملي فيعطي 18.6 mA.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "For the same circuit (E = 10 V, R = 0.5 kΩ) with a silicon diode and V_D = 0.7 V, the approximate Q-point (V_DQ, I_DQ) is:", "a": "للدائرة نفسها (E = 10 V، R = 0.5 kΩ) بدايود سيليكون وV_D = 0.7 V، نقطة التشغيل التقريبية (V_DQ, I_DQ) هي:", "c": "(0.7 V, 18.6 mA)", "w": ["(10 V, 0 mA)", "(0 V, 20 mA)", "(0.7 V, 0.7 mA)"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">(0.7 V, 18.6 mA)<\/span><\/div><div class=\"st\"><b>1. V<sub>DQ<\/sub>:<\/b> في النموذج العملي <span class=\"eq\" dir=\"ltr\">V<sub>DQ<\/sub> = 0.7 V<\/span>.<\/div><div class=\"st\"><b>2. I<sub>DQ<\/sub>:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>DQ<\/sub> = (10 − 0.7)/0.5k = 18.6 mA<\/div><\/div><div class=\"st\"><b>3. النتيجة:<\/b> نقطة التشغيل <span class=\"eq\" dir=\"ltr\">Q = (0.7 V , 18.6 mA)<\/span>.<\/div><div class=\"nt\">ملاحظة: الخياران A و B هما نقطتا تقاطع خط الحمل مع المحورين، وليستا نقطة التشغيل.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "On a diode I_D-versus-V_D graph, the DC operating point Q is located at:", "a": "على منحنى I_D مقابل V_D، تقع نقطة التشغيل DC (Q) عند:", "c": "The intersection of the diode I–V characteristic and the load line", "w": ["The origin by definition", "The maximum allowed voltage", "The midpoint of the supply axis"], "e": "<div class=\"ans\">الجواب: عند تقاطع منحنى V-I للدايود مع خط الحمل<\/div><div class=\"st\"><b>1. التعريف:<\/b> خط الحمل يمثل كل القيم الممكنة (V<sub>D<\/sub>, I<sub>D<\/sub>) التي تحقق معادلة الدائرة، ومنحنى الدايود يمثل ما يسمح به الدايود نفسه.<\/div><div class=\"st\"><b>2. النتيجة:<\/b> نقطة التشغيل Q هي النقطة التي تحقق الاثنين معاً، أي نقطة تقاطع منحنى الدايود مع خط الحمل.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "For an ideal diode conducting in forward bias, the ideal-model diode voltage V_D is:", "a": "للدايود المثالي الموصل أمامياً، جهد الدايود V_D في النموذج المثالي هو:", "c": "0 V", "w": ["0.7 V", "0.3 V", "Equal to E"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">0 V<\/span><\/div><div class=\"st\"><b>1. الدايود المثالي:<\/b> في حالة التوصيل يعمل كقصر كهربائي: <span class=\"eq\" dir=\"ltr\">V<sub>D<\/sub> = 0 V<\/span> (مقاومته صفر).<\/div><div class=\"st\"><b>2. في حالة القطع:<\/b> يعمل كدائرة مفتوحة: <span class=\"eq\" dir=\"ltr\">I<sub>D<\/sub> = 0<\/span>.<\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "A Si diode has V_D = 0.8 V and I_D = 10 mA at its Q-point. Find its DC (static) resistance R_D = V_D/I_D.", "a": "دايود Si له V_D = 0.8 V وI_D = 10 mA عند نقطة Q. أوجد مقاومته DC الساكنة R_D = V_D/I_D.", "c": "80 Ω", "w": ["8 Ω", "800 Ω", "0.008 Ω"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">80 Ω<\/span><\/div><div class=\"st\"><b>1. القانون:<\/b> <div class=\"eqblock\" dir=\"ltr\">R<sub>D<\/sub> = V<sub>D<\/sub> / I<sub>D<\/sub><\/div><\/div><div class=\"st\"><b>2. نحول الوحدات:<\/b> <span class=\"eq\" dir=\"ltr\">I<sub>D<\/sub> = 10 mA = 0.010 A<\/span><\/div><div class=\"st\"><b>3. التعويض:<\/b> <div class=\"eqblock\" dir=\"ltr\">R<sub>D<\/sub> = 0.8 / 0.010 = 80 Ω<\/div><\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "A small-signal voltage change ΔV_D = 0.010 V produces a current change ΔI_D = 0.002 A near Q. Calculate the AC (dynamic) resistance r_d.", "a": "تغير صغير في الجهد ΔV_D = 0.010 V يسبب تغيراً في التيار ΔI_D = 0.002 A قرب Q. احسب المقاومة AC الديناميكية r_d.", "c": "5 Ω", "w": ["0.02 Ω", "20 Ω", "200 Ω"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">5 Ω<\/span><\/div><div class=\"st\"><b>1. القانون:<\/b> <div class=\"eqblock\" dir=\"ltr\">r<sub>d<\/sub> = ΔV<sub>D<\/sub> / ΔI<sub>D<\/sub><\/div><\/div><div class=\"st\"><b>2. التعويض:<\/b> <div class=\"eqblock\" dir=\"ltr\">r<sub>d<\/sub> = 0.010 / 0.002 = 5 Ω<\/div><\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "If two identical conducting Si diodes are connected in parallel and the total current is 28.18 mA, the current through each is:", "a": "إذا وُصل دايودا Si متماثلان موصلان على التوازي والتيار الكلي 28.18 mA، فالتيار في كل منهما:", "c": "14.09 mA", "w": ["28.18 mA", "0.7 mA", "56.36 mA"], "e": "<div class=\"ans\">الجواب: <span class=\"eq\" dir=\"ltr\">14.09 mA<\/span><\/div><div class=\"st\"><b>1. الفكرة:<\/b> دايودان متماثلان على التوازي يتقاسمان التيار الكلي بالتساوي.<\/div><div class=\"st\"><b>2. الحساب:<\/b> <div class=\"eqblock\" dir=\"ltr\">I<sub>D1<\/sub> = I<sub>D2<\/sub> = I<sub>total<\/sub> / 2 = 28.18 / 2 = 14.09 mA<\/div><\/div>", "g": "Quiz", "h": 1}, {"t": [1], "q": "+20 V source → two Si diodes in series → 5.6 kΩ to ground. Find V_o.", "a": "مصدر +20 V ← دايودا Si على التوالي ← مقاومة 5.6 kΩ إلى الأرض. أوجد V_o.", "c": "18.6 V", "w": ["19.3 V", "20 V", "18.2 V"], "e": "نطرح هبوطي الدايودين من المصدر: <span class=\"eq\" dir=\"ltr\">V_o = 20 − 0.7 − 0.7 = 18.6 V<\/span>", "g": "Home work"}, {"t": [1], "q": "Same circuit (homework 1): find the current I_D.", "a": "الدائرة نفسها (واجب 1): أوجد التيار I_D.", "c": "3.32 mA", "w": ["3.57 mA", "3.45 mA", "0.7 mA"], "e": "<span class=\"eq\" dir=\"ltr\">I_D = V_o / 5.6k = 18.6 / 5.6k = 3.32 mA<\/span>", "g": "Home work"}, {"t": [1], "q": "E₁ = 10 V, R₁ = 4.7 kΩ, Si diode, R₂ = 2.2 kΩ, E₂ = −5 V (I = 2.073 mA). Find V₁ across R₁.", "a": "E₁ = 10 V وR₁ = 4.7 kΩ ودايود Si وR₂ = 2.2 kΩ وE₂ = −5 V (التيار I = 2.073 mA). أوجد V₁ على R₁.", "c": "9.74 V", "w": ["10 V", "4.56 V", "14.3 V"], "e": "<span class=\"eq\" dir=\"ltr\">V₁ = I × R₁ = 2.073 mA × 4.7 kΩ = 9.74 V<\/span>", "g": "Home work"}, {"t": [1], "q": "Same circuit: find V₂ across R₂.", "a": "الدائرة نفسها: أوجد V₂ على R₂.", "c": "4.56 V", "w": ["9.74 V", "5 V", "0.7 V"], "e": "<span class=\"eq\" dir=\"ltr\">V₂ = I × R₂ = 2.073 mA × 2.2 kΩ = 4.56 V<\/span>", "g": "Home work"}, {"t": [1], "q": "Same circuit: find the output voltage V_o.", "a": "الدائرة نفسها: أوجد جهد الخرج V_o.", "c": "−0.44 V", "w": ["4.56 V", "−5 V", "0.7 V"], "e": "طرف R₂ السفلي عند −5 V والعلوي أعلى منه بـ 4.56 V: <span class=\"eq\" dir=\"ltr\">V_o = −5 + 4.56 = −0.44 V<\/span>", "g": "Home work"}, {"t": [1], "q": "Clipper (Example 3.2): series R, with an ideal diode in shunt with a 4 V battery. For v_i = 16 V, v_o is:", "a": "قاطع (مثال 3.2): مقاومة R على التوالي ودايود على التوازي مع بطارية 4 V. عندما v_i = 16 V يكون v_o:", "c": "4 V", "w": ["16 V", "0 V", "12 V"], "e": "عندما v_i ≥ 4 V يكون الدايود ON فيثبّت الخرج على 4 V.", "g": "Home work"}, {"t": [1], "q": "Same clipper: for v_i = 2 V, v_o is:", "a": "القاطع نفسه: عندما v_i = 2 V يكون v_o:", "c": "2 V", "w": ["4 V", "0 V", "−4 V"], "e": "عندما v_i < 4 V يكون الدايود OFF (دائرة مفتوحة) فيمر الدخل كما هو: v_o = v_i.", "g": "Home work"}, {"t": [1], "q": "Diode OR gate, inputs +5 V and 0 V, R = 1 kΩ, Si diodes. Find V_o.", "a": "بوابة OR بالدايودات، المدخلان +5 V و0 V وR = 1 kΩ ودايودات Si. أوجد V_o.", "c": "4.3 V", "w": ["5 V", "0.7 V", "0 V"], "e": "الدايود عند 5 V يعمل ON والآخر OFF: <span class=\"eq\" dir=\"ltr\">V_o = 5 − 0.7 = 4.3 V<\/span>", "g": "Home work"}, {"t": [1], "q": "Same OR gate: find the current through R.", "a": "بوابة OR نفسها: أوجد التيار في R.", "c": "4.3 mA", "w": ["5 mA", "0.7 mA", "0 mA"], "e": "<span class=\"eq\" dir=\"ltr\">I = V_o / R = 4.3 V / 1 kΩ = 4.3 mA<\/span>", "g": "Home work"}, {"t": [1], "q": "Example 1.5: E = 8 V, two Si diodes in series, R = 2.2 kΩ. Find V_R.", "a": "مثال 1.5: E = 8 V ودايودا Si على التوالي وR = 2.2 kΩ. أوجد V_R.", "c": "6.6 V", "w": ["7.3 V", "8 V", "6.9 V"], "e": "<span class=\"eq\" dir=\"ltr\">V_R = 8 − 0.7 − 0.7 = 6.6 V<\/span>", "g": "Home work"}, {"t": [1], "q": "Same circuit (Example 1.5): find I_D.", "a": "الدائرة نفسها (مثال 1.5): أوجد I_D.", "c": "3.0 mA", "w": ["3.32 mA", "3.64 mA", "0 mA"], "e": "<span class=\"eq\" dir=\"ltr\">I_D = 6.6 / 2.2k = 3.0 mA<\/span>", "g": "Home work"}, {"t": [1], "q": "Half-wave rectifier, ideal diode, V_i = 20 V peak: magnitude of the average output is", "a": "مقوّم نصف موجة بدايود مثالي وV_i = 20 V (قيمة قصوى): مقدار القيمة المتوسطة للخرج", "c": "6.36 V", "w": ["6.14 V", "12.7 V", "20 V"], "e": "<span class=\"eq\" dir=\"ltr\">V_avg = 0.318 × 20 = 6.36 V<\/span> (تظهر سالبة في دائرة الملزمة بسبب اتجاه الدايود).", "g": "Home work"}, {"t": [1], "q": "Half-wave rectifier, Si diode, V_i = 200 V peak: magnitude of the average output is", "a": "مقوّم نصف موجة بدايود Si وV_i = 200 V: مقدار القيمة المتوسطة للخرج", "c": "63.38 V", "w": ["63.6 V", "127 V", "62.1 V"], "e": "<span class=\"eq\" dir=\"ltr\">V_avg = 0.318 (200 − 0.7) = 63.38 V<\/span>", "g": "Home work"}, {"t": [1], "q": "Load-line example (E = 10 V, R = 0.5 kΩ) using the real Si curve: the Q-point read from the graph is approximately", "a": "مثال خط الحمل (E = 10 V وR = 0.5 kΩ) بالمنحنى الحقيقي لدايود Si: نقطة Q المقروءة من الرسم تقريباً", "c": "(0.78 V, 18.5 mA)", "w": ["(0.7 V, 18.6 mA)", "(10 V, 0 mA)", "(0 V, 20 mA)"], "e": "من تقاطع خط الحمل مع المنحنى: <span class=\"eq\" dir=\"ltr\">V_DQ = 0.78 V , I_DQ = 18.5 mA<\/span> ثم <span class=\"eq\" dir=\"ltr\">V_R = 18.5 mA × 0.5k = 9.25 V<\/span>", "g": "Home work"}, {"t": [2], "q": "Which of the following is a semiconductor?", "a": "أي مما يلي شبه موصل؟", "c": "Silicon (Si)", "w": ["Copper", "Glass", "Rubber"], "e": "السيليكون والجرمانيوم أشباه موصلات؛ النحاس موصل والزجاج والمطاط عوازل.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "How many valence electrons does a silicon atom have?", "a": "كم إلكترون تكافؤ في ذرة السيليكون؟", "c": "4", "w": ["2", "6", "8"], "e": "للسيليكون 4 إلكترونات تكافؤ.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "In a pure silicon crystal, atoms are bound by:", "a": "في بلورة السيليكون النقي ترتبط الذرات بـ:", "c": "Covalent bonds", "w": ["Ionic bonds", "Metallic bonds", "Magnetic bonds"], "e": "روابط تساهمية مع أربع ذرات مجاورة.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "Which impurity atom is a donor (pentavalent)?", "a": "أي ذرة شائبة مانحة (خماسية)؟", "c": "Phosphorus (P)", "w": ["Boron (B)", "Gallium (Ga)", "Indium (In)"], "e": "الفوسفور خماسي مانح، أما البورون والغاليوم والإنديوم فثلاثية مستقبِلة.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "In P-type material the minority carriers are:", "a": "في النوع P الحاملات الأقلية هي:", "c": "Electrons", "w": ["Holes", "Donor ions", "Protons"], "e": "P: فجوات أغلبية وإلكترونات أقلية.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "In N-type material the majority carriers are:", "a": "في النوع N الحاملات الأغلبية هي:", "c": "Electrons", "w": ["Holes", "Acceptor ions", "Neutrons"], "e": "N: إلكترونات أغلبية وفجوات أقلية.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "Doping silicon with boron creates:", "a": "تطعيم السيليكون بالبورون يكوّن:", "c": "A hole in a covalent bond", "w": ["An extra free electron", "An insulating layer", "A superconductor"], "e": "البورون ثلاثي فينقص رابطة تساهمية أي تتكون فجوة.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "When N and P regions are joined, electrons diffuse from:", "a": "عند ربط المنطقتين N وP تنتشر الإلكترونات من:", "c": "The N region to the P region", "w": ["The P region to the N region", "The battery to the junction", "The depletion region outward"], "e": "بسبب فرق التركيز تنتشر الإلكترونات من N إلى P والفجوات من P إلى N.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "Recombination at the junction causes:", "a": "إعادة الاتحاد عند الوصلة تسبب:", "c": "Disappearance of mobile carriers near the junction", "w": ["More free carriers", "Melting of the crystal", "A drop in barrier potential"], "e": "تتحد الإلكترونات بالفجوات فتختفي حاملات الشحنة قرب الوصلة.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "The depletion region contains mainly:", "a": "منطقة الاستنزاف تحتوي أساساً على:", "c": "Fixed (immobile) ions", "w": ["Free electrons", "Free holes", "Photons"], "e": "أيونات ثابتة موجبة (مانحة) وسالبة (مستقبِلة) بلا حاملات متحركة.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "The internal electric field in the depletion region points from:", "a": "يتجه المجال الكهربائي الداخلي في منطقة الاستنزاف من:", "c": "N side to P side", "w": ["P side to N side", "Anode to battery", "Cathode to anode wire"], "e": "من ناحية N إلى ناحية P.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "The barrier potential:", "a": "جهد الحاجز:", "c": "Prevents further diffusion of carriers", "w": ["Increases diffusion", "Shorts the junction", "Turns electrons into holes"], "e": "يمنع المزيد من انتشار الحاملات.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "The anode of a diode is the terminal connected to:", "a": "الأنود في الدايود هو الطرف المتصل بـ:", "c": "The P-type region", "w": ["The N-type region", "An intrinsic region", "An insulator"], "e": "الأنود (+) = P والكاثود (−) = N.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "A diode is forward biased when:", "a": "يكون الدايود منحازاً أمامياً عندما:", "c": "The anode is positive relative to the cathode", "w": ["The cathode is positive relative to the anode", "No voltage is applied", "Both terminals are at the same voltage"], "e": "يتصل الأنود بالطرف الموجب فتضيق منطقة الاستنزاف.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "Under reverse bias the depletion region:", "a": "في الانحياز العكسي منطقة الاستنزاف:", "c": "Widens", "w": ["Narrows", "Disappears", "Becomes a conductor"], "e": "تتسع ولا يمر إلا تسرب صغير جداً.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "The very small current in reverse bias is called:", "a": "التيار الصغير جداً في الانحياز العكسي يسمى:", "c": "Reverse saturation (leakage) current", "w": ["Forward current", "Knee current", "Breakdown current"], "e": "تيار التشبع العكسي I_s.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "Reverse saturation current is typically in the range of:", "a": "تيار التشبع العكسي يكون عادةً بحدود:", "c": "nA to µA", "w": ["A to kA", "mA to A", "MA"], "e": "بين نانو وميكرو أمبير حسب النوع والحرارة.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "Breakdown in a diode occurs due to the:", "a": "الانهيار في الدايود يحدث بسبب:", "c": "Zener or avalanche effect", "w": ["Forward bias only", "Narrowing of the depletion region", "Low temperature only"], "e": "تأثير زينر أو الانهيار الجرفي عند V_BR.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "In breakdown the current must be limited by a series resistor to:", "a": "في الانهيار يجب تحديد التيار بمقاومة على التوالي من أجل:", "c": "Prevent damage to the diode", "w": ["Increase the voltage", "Reverse the bias", "Heat the diode"], "e": "لأن التيار يرتفع بحدة وقد يتلف الدايود.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "After the knee voltage, a small increase in voltage causes:", "a": "بعد جهد الركبة، زيادة صغيرة في الجهد تسبب:", "c": "A large increase in current", "w": ["No change in current", "A decrease in current", "Current reversal"], "e": "منحنى أُسّي: تيار يزداد بسرعة.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "The DC (static) resistance of a diode at a Q-point is:", "a": "المقاومة DC (الساكنة) للدايود عند نقطة Q هي:", "c": "V_D / I_D", "w": ["ΔV_D / ΔI_D", "E / R", "V_γ × I_D"], "e": "R_D = V_D / I_D عند نقطة التشغيل.", "g": "أسئلة متوقعة"}, {"t": [2], "q": "The AC (dynamic) resistance represents:", "a": "المقاومة AC (الديناميكية) تمثل:", "c": "The slope of the I-V curve at the Q-point", "w": ["The ratio of total V to total I", function bar(){$("pb").style.width=(done/L.length*100)+"%";$("s1").textContent="السؤال "+Math.min(i+1,L.length)+" من "+L.length;$("s2").textContent="الصحيح: "+sc}
function show(){bar();if(i>=L.length)return res();const q=L[i];

<div class="tr"><h4>ترجمة السؤال</h4><p>${fx(q.a)}</p><h4>الجواب والشرح</h4><div>${q.h?q.e:"<div class=ans>الجواب: "+q.c+"</div><div class=st>"+q.e+"</div>"}</div></div>
<button class="nx" onclick="i++;show();scrollTo(0,0)">${i==L.length-1?"عرض النتيجة":"السؤال التالي ←"}</button></div>`}
function pk(k){const q=L[i],c=$("cd");if(c.classList.contains("done"))return;c.classList.add("done");const b=c.querySelectorAll(".o");b[q.k].classList.add("ok");if(k!=q.k)b[k].classList.add("no");else sc++;done++;bar()}
